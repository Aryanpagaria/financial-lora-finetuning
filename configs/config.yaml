  best_model: artifacts/best_model
  lora_adapter: artifacts/lora_adapter
  evaluation: artifacts/evaluation
  logs: artifacts/logs

model:
  config: configs/model/model.yaml

training:
  config: configs/training/training.yaml

checkpoint:
  config: configs/checkpoint/checkpoint.yaml

evaluation:
  config: configs/evaluation/evaluation.yaml

inference:
  config: configs/inference/inference.yaml

logging:
  config: configs/logging/logging.yaml