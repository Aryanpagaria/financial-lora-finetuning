inference:
  enabled: true

  model:
    use_trained_adapter: true
    adapter_directory: artifacts/lora_adapter

  generation:
    max_new_tokens: 256
    do_sample: false
    temperature: 0.0
    top_p: 1.0
    repetition_penalty: 1.0
    no_repeat_ngram_size: 0
    early_stopping: true

  chat:
    enabled: true
    max_history: 10

  reproducibility:
    seed: 42

  output:
    save_responses: false
    directory: artifacts/inference