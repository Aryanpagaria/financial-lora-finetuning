inference:
  base_model:
    name: Qwen/Qwen2.5-3B-Instruct

  adapter:
    directory: artifacts/lora_adapter

  tokenizer:
    directory: artifacts/lora_adapter

  generation:
    max_new_tokens: 256

    min_new_tokens: 1

    temperature: 0.0

    do_sample: false

    top_p: 1.0

    top_k: 50

    repetition_penalty: 1.0

    no_repeat_ngram_size: 0

  input:
    max_length: 512

  device:
    device_map: auto

  validation:
    require_adapter: true
    require_tokenizer: true