model:
  name: Qwen/Qwen2.5-3B-Instruct

  trust_remote_code: true

  quantization:
    enabled: true
    load_in_4bit: true
    quantization_type: nf4
    use_double_quantization: true
    compute_dtype: float16

  device:
    device_map: auto

  gradient_checkpointing:
    enabled: true

  use_cache: false

lora:
  enabled: true

  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

  modules_to_save: []

tokenizer:
  padding_side: right
  truncation_side: right
  use_fast: true
  add_eos_token: true
  add_bos_token: false