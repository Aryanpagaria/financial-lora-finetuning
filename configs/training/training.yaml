training:
  batch_size: 1
  epochs: 10
  max_epochs_per_session: 2

  learning_rate: 0.0002
  weight_decay: 0.01

  max_seq_length: 512
  gradient_checkpointing: true
  random_seed: 42

  gradient_accumulation_steps: 4
  warmup_ratio: 0.03

  fp16: true
  bf16: false



optimizer:
  name: "adamw"

scheduler:
  name: "linear"

early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.001

wandb:
  enabled: true
  project: "financial-lora-finetuning"
  run_name: "qwen-lora-finqa"

  tags:
    - "LoRA"
    - "FinQA"

  notes: "Initial training run"
